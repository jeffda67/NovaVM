name: NovaVM
options:
  bundleIdPrefix: com.jeffda67
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: "NO"
targets:
  NovaVM:
    type: application
    platform: iOS
    sources:
      - path: NovaVM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffda67.novavm
        PRODUCT_NAME: NovaVM
        INFOPLIST_KEY_CFBundleDisplayName: NovaVM
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGNING_ALLOWED: NO
